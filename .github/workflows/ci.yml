name: Build e testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Desafio.Estoque/Desafio.Estoque.csproj --configuration Release
      - run: dotnet test tests/Desafio.Estoque.Tests/Desafio.Estoque.Tests.csproj --configuration Release
